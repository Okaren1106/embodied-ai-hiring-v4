        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories: {}
      RF_DATA_INFRA_OPERATIONS:
        definition: 数据资产、数据工程与生产治理，以及统计建模和数据科学分析服务
        deliverable: 数据管线/真值/生产网络，或可靠性预测、异常根因分析、运行经济性和决策支持
        include: 数据工程、生产治理、数据科学分析；分析可交付神经预测模型并部署，按持续分析服务责任判。
        exclude: 亲自遥操/标注；通用存储底座；以模型学习能力为主的ML工程；直接承担财务、质量放行或VOC闭环等业务结果。
        nearest_boundary: 数据分析以运营现象解释、预测与决策服务为责任；ML以可用模型组件、训练方法或学习系统性能为责任。
        evidence_required: 本人数据资产/生产责任，或明确分析问题、分析预测产出与服务目的。
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 预测部件剩余寿命并生成维护计划和成本驱动分析。
          counterexample: 设计双目深度网络架构和损失，训练达成模型精度目标。
          insufficient: 熟悉数据分析
        name: 数据与分析
        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories:
          DATA_ENGINEERING_INFRA: *id001
          DATA_PRODUCTION_GOVERNANCE: *id002
          DATA_SCIENCE_ANALYTICS: *id003
      RF_SIMULATION_EVALUATION:
        definition: 仿真环境或可反复使用的评测、校准、测量表征方法/工具链
        deliverable: 仿真环境或可反复使用的评测、校准、测量表征方法/工具链
        include: 主要交付复用能力；说明跨版本/对象/流程重复使用；交接他人是强证据但非必要
        exclude: 设计自测；产品验证执行、合规放行、缺陷闭环
        nearest_boundary: 先判断是否设计自测，再区分复用评测能力与质量结果；同等主责保留歧义
        evidence_required: 可复用交付物＋复用对象/流程/用户的明确证据
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 开发跨型号执行器表征工具链供每次迭代使用
          counterexample: 执行产品验证计划并闭环缺陷；自测本人电路
          insufficient: 开发测试平台并执行测试，未说明复用与主次
        name: 仿真、评测与测量工具链
        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories: {}
        display_note: 含EOL/ICT/FCT、HiL、产测与校准等可复用测量能力。该类份额不能直接解释为仿真研究份额；研究或部署活动须独立取证。
      RF_HARDWARE_ELECTRICAL:
        definition: 电路、板卡、电气互连、FPGA、低层固件和电子驱动
        deliverable: 电路、板卡、电气互连、FPGA、低层固件和电子驱动
        include: 本人设计调通电子电气子系统，自身设计验证为配套
        exclude: 产品级质量执行；仅机械结构设计；纯维修
        nearest_boundary: 工厂场所不改设计职能；电机结构与驱动电路分开
        evidence_required: 具体电路/固件/电气子系统与设计调试责任
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 设计驱动板电路并验证自身设计
          counterexample: 组织整机合规验证和质量放行
          insufficient: 了解电子，协助其他团队
        name: 硬件与电气
        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories: {}
      RF_MECHANICAL_MECHATRONICS:
        definition: 机械结构、机构、传动、本体图纸及设计性能
        deliverable: 机械结构、机构、传动、本体图纸及设计性能
        include: 机械方案、图纸及性能；具有实质机械设计责任、交付完整机电原型的综合开发。
        exclude: 工业外观/交互设计；纯按图装配；电子板卡主导；系统架构、要求及接口主导。
        nearest_boundary: 综合实体原型与跨域架构决策区分；测功机的机械设计不自动变成独立评测。
        evidence_required: 明确机械对象＋本人设计和性能责任
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 设计腿部传动机构、出图并验证强度
          counterexample: 执行装配生产工艺；设计机器人外观色彩材质
          insufficient: 机械电气软件全流程支持，主责不明
        name: 机械与机电
        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories: {}
      RF_MANUFACTURING_QUALITY_SUPPLY:
        definition: 制造工艺、装配生产、供应采购或产品验证/质量闭环结果
        deliverable: 制造工艺、装配产物、供应/库存履约，或质量验证结论与缺陷闭环
        include: 工艺制造、原型按图加工装配、采购供应；内部研究物料库存、备料和履约运营；独立产品验证/合规及缺陷闭环。
        exclude: 本人设计自测；主要交付可复用评测方法/仿真
        nearest_boundary: 物料可获得性不同于数据产出；研发阶段仍可制造或质量；设备维护可用性归服务；系统安全架构归系统工程。
        evidence_required: 工艺/供应/验证计划或结果＋责任对象
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 执行整机可靠性验证，追踪缺陷至质量放行
          counterexample: 设计可跨版本复用的校准算法和测量工具链
          insufficient: 参与测试与工厂工作
        name: 制造、质量与供应链
        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories: {}
      RF_DEPLOYMENT_FIELD_SERVICE:
        definition: 设备安装验收、维修维护，以及内部试验设备与环境服务
        deliverable: 设备、台架与试验环境的可用性及安装维护支持
        include: 客户现场或内部实验室设备服务；维护、校准、环境提供、安全检查。
        exclude: 本人设计自测；独立质量验证结论；复用测量方法研发；跨域系统架构。
        nearest_boundary: 维护台架使别人能测试归服务；设计测量方法归评测；设计台架机械本体归机械。
        evidence_required: 具体安装/诊断/维修任务和本人设备责任
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 安装采集机器人并负责故障修复与预防维护
          counterexample: 遥操采集，遇故障上报工程团队
          insufficient: 支持现场相关工作
        name: 部署与现场服务
        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories: {}
      RF_PRODUCT_PROGRAM:
        definition: 产品需求/路线图或项目范围、资源、依赖及里程碑
        deliverable: 产品需求/路线图或项目范围、资源、依赖及里程碑
        include: 明确产品定义、优先级或跨职能项目管理交付
        exclude: 所有技术经理；纯整机系统架构；商业市场分析本身
        nearest_boundary: 技术团队经理随其技术交付；市场洞察以商业决策为交付归商务
        evidence_required: 本人需求/路线图/项目管理对象与责任
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 制定产品需求和路线图，管理跨团队交付依赖
          counterexample: 负责控制团队控制器性能与技术交付
          insufficient: 配合项目团队工作
        name: 产品与项目
        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories: {}
      RF_COMMERCIAL_CUSTOMER:
        definition: 市场获客、销售客户经营、商业战略/市场洞察及客户体验/VOC闭环
        deliverable: 市场获客、销售客户经营、商业战略/市场洞察及客户体验/VOC闭环
        include: 销售品牌；以商业决策为目的的行业竞品洞察；以客户体验改善为目的的反馈分析和推动闭环
        exclude: 科学研究；跨职能通用业务分析；数据管线；产品路线图主责
        nearest_boundary: 新增COMMERCIAL_STRATEGY_INSIGHTS和CUSTOMER_EXPERIENCE_VOC；以交付目的区分产品管理与数据分析
        evidence_required: 商业/客户问题＋分析或经营动作＋决策/改善交付
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 分析行业竞争格局形成商业策略建议；整理VOC并推动体验改进
          counterexample: 建设标注数据管线；提出通用学习理论；交付产品路线图
          insufficient: 跟踪市场信息，未给出工作用途或交付
        name: 商务与客户
        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories:
          COMMERCIAL_STRATEGY_INSIGHTS: *id004
          CUSTOMER_EXPERIENCE_VOC: *id005
      RF_CORPORATE_SUPPORT:
        definition: 公司职能支持、综合运营及教育技术内容支持
        deliverable: 财务人事法务行政、公司规划治理和管理层执行支持，课程教材与教学资料
        include: 传统公司支持；整体公司运营；面向员工、高校或外部教学的课程、课件与教育内容。 公司信息/数据/访问安全的制度、风险、合规与应急治理归公司支持；直接交付安全软件或平台归软件，设备固件安全归硬件；仅协调项目范围、资源和里程碑才归产品项目。可选软件开发不取代必选治理主线。
        exclude: 客户经营；产品路线图；设备服务；物料供应；不能按非技术或为内部服务一概纳入。
        nearest_boundary: 综合公司运营有持续公司级交付；课程中的机器人技术是教学对象；CAD平台管理归软件。
        evidence_required: 职能支持/运营/教育内容产出；HR集合招聘有明确正文HR方向可按R01作LIMITED主类。
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 管理招聘流程、财务报表或非市场政策关系
          counterexample: 面向政府客户拓展销售商机
          insufficient: 通用岗位说明，未列实际职责
        name: 公司支持
        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories: {}
      RF_ROBOT_OPERATIONS:
        definition: 本人运行/遥操机器人、现场采集或人工标注成果
        deliverable: 本人运行/遥操机器人、现场采集或人工标注成果
        include: 明确本人执行数据采集、机器人操作或逐项标注
        exclude: 管理采集网络/排班质量；主要维护设备
        nearest_boundary: 执行、组织数据生产与维护设备按交付分开
        evidence_required: 明确本人操作/采集/标注动作，不能仅凭标题
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 遥操机器人完成演示并标注采集数据
          counterexample: 管理多站点采集生产网络和人员排班
          insufficient: 数据采集员标题，正文空白
        name: 机器人操作
        evidence_policy: 下列证据要求用于直接交付判断；只有一级职能方向明确时可按R01/R03作LIMITED归属。子类和其他维度仍需各自证据。
        subcategories: {}
      RF_SYSTEMS_ENGINEERING_INTEGRATION:
        name: 系统工程与跨域集成
        definition: 整机跨域架构、需求分解、接口约束与系统集成技术决策
        deliverable: 整机跨域架构、需求分解、接口约束与系统集成技术决策
        include: 对机械、电气、软件跨域约束和整机集成结果负责；包括功能安全系统需求与接口、启动集成和跨域故障决策。
        exclude: 只协调进度归项目；软件接口实现归软件；单域设计随领域；质量测试执行不等于安全系统架构。
        nearest_boundary: 架构/要求/接口及跨域技术取舍区别于机械实体原型；整机集成决策区别于例行安装维护。
        evidence_required: 本人承担跨域技术责任＋整机架构/需求/接口/集成交付，非仅跨部门沟通。
        evidence_policy: 适用R01/R03一般粗粒度规则；不得从主类反推其他维度。
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 分解机器人功能安全要求，维护机械电气软件接口并裁决系统集成故障。
          counterexample: 跟踪各团队里程碑并安排会议。
          insufficient: 系统工程师，协助各部门，无技术交付。
        subcategories: {}
      RF_INDUSTRIAL_EXPERIENCE_DESIGN:
        name: 工业与体验设计
        definition: 工业外观、CMF、交互流程、用户旅程与体验原型
        deliverable: 工业外观、CMF、交互流程、用户旅程与体验原型
        include: 外观比例与覆盖件视觉设计、材质色彩；用户交互/服务体验设计；场景创意明确但细项不足可只判一级。
        exclude: 结构强度/机构图纸归机械；产品路线图归产品；VOC经营闭环归商务；界面软件实现归软件。
        nearest_boundary: 设计方案与体验原型不同于反馈分析运营或项目需求管理。
        evidence_required: 本人承担外观/交互/体验设计产出；明确设计方向但无细项时不强加子类。
        evidence_policy: 适用R01/R03一般粗粒度规则；不得从主类反推其他维度。
        examples:
          kind: SYNTHETIC_TEACHING_NOT_EMPIRICAL
          positive: 交付用户旅程、交互流程及可测试体验原型。
          counterexample: 整理客户投诉并推动VOC闭环。
          insufficient: 设计师，支持机器人项目，无设计对象。
        subcategories:
          DESIGN_INDUSTRIAL_CMF: *id006
          DESIGN_INTERACTION_EXPERIENCE: *id007
    missing: 不可评估、未编码、执行失败、歧义、未映射、可评估未明示及不适用分别保存。
