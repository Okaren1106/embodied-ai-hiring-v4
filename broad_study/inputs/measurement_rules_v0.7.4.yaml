requirement_logic:
  relations:
  - ALL
  - OR
  - SOME_OF
  - OR_EQUIVALENT
  - EXAMPLE
  - UNRESOLVED
  contract: 每组保留use、header、证据与scope；expression为递归树，每节点有唯一id与证据，内部relation及children，叶ITEM含surface。子节点证据落在父节点；每个要求标签用requirement_node_id连接叶。ALL/OR/SOME_OF/OR_EQUIVALENT/EXAMPLE/UNRESOLVED可嵌套；UNRESOLVED附reason；SOME_OF附minimum_explicit或null。组relation等于树根，不把例子当全部必需，不把斜线默认为AND/OR。
  examples:
  - - Python and C++ required
    - ALL
    - REQUIRED
  - - C++ and/or Python
    - OR
    - GENERAL_REQUIREMENT
  - - at least some of Python, C++, SQL
    - SOME_OF
    - GENERAL_REQUIREMENT
  - - Python or equivalent
    - OR_EQUIVALENT
    - GENERAL_REQUIREMENT
  - - e.g. Python, C++
    - EXAMPLE
    - GENERAL_REQUIREMENT
  - - No ROS experience required
    - ALL
    - NEGATED
